# Конфигурация DCA-бота и скринера. Этап: Testnet.
# Рабочий вариант от 06.08: связка v3 (WR 85% на 90д) + порог NATR 1.5-5%.
# Источник цифр: бэктесты tools/backtest.py на пуле 114 монет.

dca:
  # Размер входа в USDT, а не в единицах монеты.
  # v3 (grid_bt_trades_v3, 90д): вход 20 USDT, 2 докупки с Мартингейлом x2 —
  # лестница 20→40→80 USDT, TP 1.2% лимиткой, HOLD 90 мин.
  entry_usdt: 20
  # Шаг усреднения, %. Если включён адаптивный шаг (step_atr_mult > 0), это
  # значение — фолбэк для циклов без NATR в сигнале (восстановленных).
  step_pct: 1.2
  # Адаптивный шаг сетки от ATR-14 (NATR из сигнала скринера):
  # эффективный шаг цикла = clamp(NATR * step_atr_mult, step_min_pct, step_max_pct).
  # Шире фиксированных 1.2%: пила в 2% (провал перед подъёмом) раньше ложилась
  # целиком на один шаг сетки. step_atr_mult: 0 — фиксированный step_pct.
  step_atr_mult: 1.0
  step_min_pct: 0.9
  step_max_pct: 3.0
  steps: 2                    # количество докупок (v3: 2 → лестница 20/40/80)
  # Множитель объёма Мартингейла: объём докупки k = entry_usdt * multiplier^k.
  # 2.0 — v3 (MARTIN): лестница 20→40→80 USDT. Мартингейл наращивает риск:
  # avg loss в v3 был −9.16 (без стопа) против +0.64 avg win.
  multiplier: 2.0             # v3 (MARTIN): 20→40→80 USDT
  take_profit_pct: 1.2        # TP лимиткой (maker 0.02%); v3: WR 85% на 90д
  # Поуровневый тейк-профит: процент TP выбирается по числу выполненных
  # докупок (уровень 0 = вход без доливок), эскалация 1.2 → 1.5 → 2.0%;
  # выше последнего уровня удерживается максимум, пустой список — фиксированный
  # take_profit_pct. Соответствует take_profit_pct_at в reference/bot.py.
  tp_escalation: [1.2, 1.5, 2.0]
  # Трейлинг-тейк-профит: активация при прибыли ≥ trail_trigger_pct, после чего
  # уровень выхода тащится за пиком цены, и откат на trail_step_pct от пика
  # закрывает цикл. 0 — выключен (тогда цикл выходит только по обычному TP).
  # Обычный TP остаётся фолбэком: если пик не поднялся выше take_profit_pct,
  # сработает он. В худшем случае трейлинг оставляет прибыль
  # trail_trigger_pct - trail_step_pct.
  trail_trigger_pct: 1.0
  trail_step_pct: 0.3
  # Аварийный стоп от средней цены входа: при достижении уровня монитор
  # закрывает позицию рыночным ордером. 0 — стоп выключен (как в базовом боте).
  hard_sl_pct: 5.0            # v3+SL5 (90д): PnL −83.21 → −57.65, WR 82%
  # Адаптивный аварийный стоп от ATR-14: эффективный стоп цикла =
  # clamp(NATR * sl_atr_mult, sl_min_pct, sl_max_pct). При шумных проколах
  # (NATR высокий) стоп отодвигается от входа, чтобы его не выбивал шум;
  # в спокойном рынке — подтягивается. sl_atr_mult: 0 — фиксированный hard_sl_pct.
  # 1.5 — Test A из A/B-бэктеста (ab_sl.py, 40 монет × 14 д): PnL +3.64 vs +3.10
  # у Baseline, просадка 2.40 vs 3.55, средний SL −1.09 vs −1.44.
  sl_atr_mult: 1.5
  sl_min_pct: 1.0
  sl_max_pct: 8.0
  # Жёсткий лимит убытка цикла в USDT: страховка от проскальзывания/гэпа, когда
  # ценовой стоп не успел выйти. 0 — выключен. В A/B кап 3 USDT не срабатывал ни
  # раз (макс. SL-убыток −1.60), поэтому значение зажато до 1.8 — ближе к
  # реальному размеру стопа, при этом не режет нормальные SL (средний −1.09).
  max_cycle_loss_usdt: 1.8
  # Принудительный выход по времени: порог берётся из этого значения, а не
  # захардкожен в monitor.py. 0 — таймер выключен (FR-014).
  max_hold_hours: 1.5         # v3: HOLD 90 минут (time_exit)
  # Тейк-профит на стороне биржи: срабатывает, даже если процесс бота умер —
  # за 72 часа на Android это ожидаемое событие. При false закрытие берёт на
  # себя монитор, и тогда смерть процесса оставит позицию без выхода.
  exchange_take_profit: true
  leverage: 4                 # фиксированное плечо для любой монеты
  # Предел суммарного номинала на символ: лестница v3 20+40+80=140 USDT,
  # предел 200 оставляет запас и остаётся работающей защитой: подними
  # entry_usdt или steps — и план будет отклонён.
  max_notional_usdt: 200

bot:
  autostart: true             # принимать сигналы сразу после старта процесса
  max_cycles: 3               # одновременно открытых циклов (FR-015)
  fill_timeout_ms: 5000       # сколько ждать подтверждения исполнения
  # Такт сопровождения циклов. Триггеры докупок стоят на 1.5% друг от друга,
  # поэтому опоздание на пару секунд ничего не меняет — в отличие от входа,
  # где бюджет 2 секунды. За такт уходит не больше четырёх запросов.
  monitor_interval_sec: 3
  max_clock_skew_ms: 3000     # больше — старт запрещён (FR-032)
  heartbeat_sec: 60
  journal_path: "logs/bot-events.jsonl"

bybit:
  # Ключи API Testnet (https://testnet.bybit.com → API → Create New Key,
  # разрешения: Spot/Contract trade — Read-Write). Можно задать переменными
  # окружения BYBIT_API_KEY / BYBIT_API_SECRET — они имеют приоритет.
  testnet: true               # true — api-testnet.bybit.com (demo-контур)
  api_key: ""                 # placeholder; заполнить перед --live
  api_secret: ""              # placeholder; заполнить перед --live
  recv_window_ms: 5000

telegram:
  enabled: false              # уведомления в Telegram о событиях бота (T031)
  bot_token: ""               # токен бота @BotFather, например "123456:ABC-..."
  chat_id: ""                 # ID чата/канала, куда слать сообщения
  parse_mode: "HTML"          # HTML | MarkdownV2 | "" (без форматирования)

server:
  host: "0.0.0.0"
  port: 8000

signals:
  # true — бот слушает HTTP POST /signal
  # false — бот читает inbox_file каждые heartbeat_sec
  use_http: true
  inbox_file: "signals_inbox.json"

screener:
  bot_api_url: "http://127.0.0.1:8000"
  top_n_turnover: 600         # ликвидность по обороту с самой биржи [TEST: 50, prod: 300]
  # Первые N символов по обороту пропускаются — низковолатильные гиганты
  # (BTC, ETH...) почти не дают сигналов, а подписка на их потоки дорогая.
  skip_top_volume: 1
  require_testnet: true       # false — строить вселенную только по mainnet
                              # (диагностика скринера вне тестнет-контура)
  natr_period: 14
  natr_min: 0.95              # 0.95-5.0%: порог входной волатильности (снижен с 1.5)
  natr_max: 5.0               # +3.19 PnL, WR 89.3%, max drawdown −2.8 (30д, базовые параметры)
  uhlo_length: 15
  tf_fast: "1"
  tf_slow: "15"
  cooldown_sec: 300           # пауза между сигналами по одному символу
  required_leverage: 4        # должно совпадать с dca.leverage
  reject_log: candidates      # all | candidates | none
  reseed_after_sec: 90        # обрыв длиннее — перечитать историю свечей
  pump_volume_mult: 3.0       # LONG-сигнал гасится, если объём закрытой свечи
                              # выше этого множителя × среднего за 20 свечей И
                              # длинная верхняя тень (0 — защита выключена)
  pump_wick_ratio: 0.5        # порог верхней тени: доля размаха бара
  short_highs_max: 90.0       # SHORT не входим, пока 1м «зажат на пике» без
                              # импульса вниз: UHLO highs 1м выше порога (цена
                              # прижата к максимумам окна). Красный требует
                              # highs 1м <= 20, поэтому срабатывает только на
                              # границах расширенных полос (100 — выключено)
  long_lows_min: 90.0         # LONG не входим, пока 1м «зажат у дна» (ловля
                              # падающего ножа): UHLO lows 1м выше порога (цена
                              # прижата к минимумам окна). Зелёный требует
                              # lows 1м <= 20, поэтому срабатывает только на
                              # границах расширенных полос (100 — выключено)
  journal_path: "logs/screener-events.jsonl"
  # Paper-режим: сигналы НЕ уходят на bot_api_url, а пишутся в журнал
  # (signal_dry_run) и, при настроенном telegram ниже, уходят в Telegram.
  # Команда: python3 reference/screener.py --dry-run (или --telegram-test).
  dry_run: false
  # «Чистый крипто-пул»: в скринер попадают только USDT-перпетуалы, которые
  # есть в топе CoinGecko по капитализации (0 — фильтр выключен). Отсекает
  # токенизированные акции/ETF (bStocks: TSLA, NVDA, SOXL, XAU...), индексные
  # токены и леверидж-токены (SNXX, ...) — их на CoinGecko нет. Значение
  # Top-300/500 — по усмотрению: больше ранг, шире пул.
  cg_max_rank: 500
  # Суточный оборот Bybit (turnover24h, USDT) от этого значения — отсечение
  # «пустого пула» с малой ликвидностью. От $1M+.
  min_turnover_usdt: 1000000
  # Явный blacklist символов Bybit по полному имени (INXUSDT, ...). Список
  # расширяемый: добавь символ через запятую — он будет исключён из вселенной.
  blacklist: ["INXUSDT"]
  # bStocks и прочие нетипичные деривативы по базовой монете. Список ДОПОЛНЯЕТ
  # встроенный DEFAULT_STOCK_BLACKLIST (акции/ETF/индексы/сырьё), не заменяет.
  # INX — индекс-токен (INXUSDT): гэпит, под 5%-стоп не ложится (−6.7% за стоп).
  base_coin_blacklist: ["INX"]
