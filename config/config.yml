# Конфигурация DCA-бота и скринера. Этап: Testnet.
# Рабочий вариант от 06.08: связка v3 (WR 85% на 90д) + порог NATR 1.5-5%.
# Источник цифр: бэктесты tools/backtest.py на пуле 114 монет.

dca:
  # Размер входа в USDT, а не в единицах монеты.
  # v3 (grid_bt_trades_v3, 90д): вход 20 USDT, 2 докупки с Мартингейлом x2 —
  # лестница 20→40→80 USDT, TP 1.2% лимиткой, HOLD 90 мин. Адаптивный шаг
  # (clamp(NATR*1.0, 0.9-1.2)%) реализован только в tools/backtest.py; в бою
  # бот усредняет фиксированным шагом. При NATR>=1.5 адаптивный шаг всегда
  # упирается в верхнюю границу 1.2% — поэтому step_pct: 1.2 эквивалентен ему.
  entry_usdt: 20
  step_pct: 1.2               # эквивалент адаптивного шага v3 при NATR 1.5-5%
  steps: 2                    # количество докупок (v3: 2 → лестница 20/40/80)
  # Множитель объёма Мартингейла: объём докупки k = entry_usdt * multiplier^k.
  # 2.0 — v3 (MARTIN): лестница 20→40→80 USDT. Мартингейл наращивает риск:
  # avg loss в v3 был −9.16 (без стопа) против +0.64 avg win.
  multiplier: 2.0             # v3 (MARTIN): 20→40→80 USDT
  take_profit_pct: 1.2        # TP лимиткой (maker 0.02%); v3: WR 85% на 90д
  # Аварийный стоп от средней цены входа: при достижении уровня монитор
  # закрывает позицию рыночным ордером. 0 — стоп выключен (как в базовом боте).
  hard_sl_pct: 5.0            # v3+SL5 (90д): PnL −83.21 → −57.65, WR 82%
  # Принудительный выход по времени: порог берётся из этого значения, а не
  # захардкожен в monitor.py. 0 — таймер выключен (FR-014).
  max_hold_hours: 1.5         # v3: HOLD 90 минут (time_exit)
  # Тейк-профит на стороне биржи: срабатывает, даже если процесс бота умер —
  # за 72 часа на Android это ожидаемое событие. При false закрытие берёт на
  # себя монитор, и тогда смерть процесса оставит позицию без выхода.
  exchange_take_profit: true
  leverage: 4                 # фиксированное плечо для любой монеты
  # Предел суммарного номинала на символ: лестница v3 20+40+80=140 USDT,
  # предел 200 оставляет запас и остаётся работающей защитой: подними
  # entry_usdt или steps — и план будет отклонён.
  max_notional_usdt: 200

bot:
  autostart: true             # принимать сигналы сразу после старта процесса
  max_cycles: 3               # одновременно открытых циклов (FR-015)
  fill_timeout_ms: 5000       # сколько ждать подтверждения исполнения
  # Такт сопровождения циклов. Триггеры докупок стоят на 1.5% друг от друга,
  # поэтому опоздание на пару секунд ничего не меняет — в отличие от входа,
  # где бюджет 2 секунды. За такт уходит не больше четырёх запросов.
  monitor_interval_sec: 3
  max_clock_skew_ms: 3000     # больше — старт запрещён (FR-032)
  heartbeat_sec: 60
  journal_path: "logs/bot-events.jsonl"

server:
  host: "0.0.0.0"
  port: 8000

signals:
  # true — бот слушает HTTP POST /signal
  # false — бот читает inbox_file каждые heartbeat_sec
  use_http: true
  inbox_file: "signals_inbox.json"

screener:
  bot_api_url: "http://127.0.0.1:8000"
  top_n_turnover: 600         # ликвидность по обороту с самой биржи [TEST: 50, prod: 300]
  natr_period: 14
  natr_min: 1.5               # 1.5-5.0%: единственный протестированный порог в плюсе
  natr_max: 5.0               # +3.19 PnL, WR 89.3%, max drawdown −2.8 (30д, базовые параметры)
  uhlo_length: 20
  tf_fast: "1"
  tf_slow: "15"
  cooldown_sec: 300           # пауза между сигналами по одному символу
  required_leverage: 4        # должно совпадать с dca.leverage
  reject_log: candidates      # all | candidates | none
  reseed_after_sec: 90        # обрыв длиннее — перечитать историю свечей
  journal_path: "logs/screener-events.jsonl"
  # «Чистый крипто-пул»: в скринер попадают только USDT-перпетуалы, которые
  # есть в топе CoinGecko по капитализации (0 — фильтр выключен). Отсекает
  # токенизированные акции/ETF (bStocks: TSLA, NVDA, SOXL, XAU...), индексные
  # токены и леверидж-токены (SNXX, ...) — их на CoinGecko нет. Значение
  # Top-300/500 — по усмотрению: больше ранг, шире пул.
  cg_max_rank: 500
  # Суточный оборот Bybit (turnover24h, USDT) от этого значения — отсечение
  # «пустого пула» с малой ликвидностью. От $1M+.
  min_turnover_usdt: 1000000
  # Явный blacklist символов Bybit (если нужно исключить что-то по имени).
  symbol_blacklist: []
  # bStocks и прочие нетипичные деривативы по базовой монете. Список ДОПОЛНЯЕТ
  # встроенный DEFAULT_STOCK_BLACKLIST (акции/ETF/индексы/сырьё), не заменяет.
  base_coin_blacklist: []
